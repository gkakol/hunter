name: Neobus Fare Tracker & Chart Generator

on:
  schedule:
    # Uruchamianie co 15 minut
    - cron: '*/15 * * * *'
  workflow_dispatch: # Możliwość ręcznego uruchomienia w zakładce Actions

permissions:
  contents: write

jobs:
  track-and-visualize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas

      - name: Run Fare Hunter Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python fare_hunter.py

      - name: Generate Price Charts
        run: |
          python generate_chart.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Neobus Hunter Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Aktualizacja cen, miejsc i wykresów [skip ci]" || exit 0
          git pull --rebase origin main
          git push
