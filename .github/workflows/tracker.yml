name: Monitor Cen

on:
  schedule:
    # Uruchamianie co 20 minut
    - cron: '*/20 * * * *'
  workflow_dispatch: # Możliwość uruchomienia ręcznego

permissions:
  contents: write

jobs:
  track-and-visualize:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja wymaganych bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas seaborn

      - name: Uruchomienie bota sprawdzającego ceny i miejsca
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python fare_hunter.py

      - name: Generowanie wykresów cenowych
        run: |
          python generate_chart.py

      - name: Zapis i wysłanie zmian do repozytorium
        run: |
          git config --global user.name "Neobus Hunter Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Automatyczna aktualizacja danych i wykresów" || exit 0
          git pull --rebase origin main
          git push
