name: Neobus Ticket Hunter

on:
  schedule:
    # Uruchamiaj automatycznie co 20 minut
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Przygotuj środowisko Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj biblioteki
        run: |
          pip install requests pandas matplotlib

      - name: Uruchom bota i zbierz dane
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python fare_hunter.py

      - name: Wygeneruj wykres cen
        run: |
          python generate_chart.py

      - name: Zapisz historię i wykres w repozytorium
        run: |
          git config --global user.name "Neobus Hunter Bot"
          git config --global user.email "bot@neobushunter.local"
          git add ceny_historia.csv wykres_cen.png
          git commit -m "Aktualizacja cen i wykresu [skip ci]" || echo "Brak zmian do zapisu"
          git push
